version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: alaska_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password}
      POSTGRES_DB: alaska_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: alaska_backend_prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.prod
    environment:
      NODE_ENV: production
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: alaska_redis_prod
    restart: always
    ports:
      - "6380:6379"

  mongodb:
    image: mongo:7
    container_name: alaska_mongo_prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata_prod:/data/db

  chat-gateway:
    build: 
      context: ./chat-gateway
      dockerfile: Dockerfile
    container_name: alaska_chat_gateway_prod
    restart: always
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - WORKER_URL=http://chat-worker:4002
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-prod_secure_secret_123}
    depends_on:
      - redis
      - chat-worker

  chat-worker:
    build: 
      context: ./chat-worker
      dockerfile: Dockerfile
    container_name: alaska_chat_worker_prod
    restart: always
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongodb:27017/alaska-chat
      - NODE_ENV=production
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-prod_secure_secret_123}
    depends_on:
      - redis
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_CHAT_WORKER_URL: http://localhost:4002/api
        VITE_CHAT_GATEWAY_URL: http://localhost:4001
    container_name: alaska_frontend_prod
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api
      - chat-gateway
      - chat-worker

volumes:
  pgdata_prod:
  mongodata_prod:
