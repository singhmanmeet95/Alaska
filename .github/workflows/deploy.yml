name: CI/CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        run: |
          docker build -t ${{ vars.DOCKER_REGISTRY }}/alaska-api:latest ./backend
          docker push ${{ vars.DOCKER_REGISTRY }}/alaska-api:latest

      - name: Build and push Chat Gateway image
        run: |
          docker build -t ${{ vars.DOCKER_REGISTRY }}/alaska-chat-gateway:latest ./chat-gateway
          docker push ${{ vars.DOCKER_REGISTRY }}/alaska-chat-gateway:latest

      - name: Build and push Chat Worker image
        run: |
          docker build -t ${{ vars.DOCKER_REGISTRY }}/alaska-chat-worker:latest ./chat-worker
          docker push ${{ vars.DOCKER_REGISTRY }}/alaska-chat-worker:latest

      - name: Build and push Frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://${{ secrets.VM_PUBLIC_IP }}:3000/api \
            --build-arg VITE_CHAT_WORKER_URL=http://${{ secrets.VM_PUBLIC_IP }}:4002/api \
            --build-arg VITE_CHAT_GATEWAY_URL=http://${{ secrets.VM_PUBLIC_IP }}:4001 \
            -t ${{ vars.DOCKER_REGISTRY }}/alaska-frontend:latest ./frontend
          docker push ${{ vars.DOCKER_REGISTRY }}/alaska-frontend:latest

      - name: Copy docker-compose file to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/alaska_deployment"

      - name: Execute Deployment on VM
        uses: appleboy/ssh-action@v1.0.0
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REGISTRY_PASSWORD,REGISTRY_USERNAME,DOCKER_REGISTRY
          script: |
            cd ~/alaska_deployment
            
            # Login to Docker on the VM
            echo "$REGISTRY_PASSWORD" | docker login $DOCKER_REGISTRY -u "$REGISTRY_USERNAME" --password-stdin
            
            # Pull the latest images from Registry
            docker compose -f docker-compose.prod.yml pull
            
            # Restart the services with the new images
            docker compose -f docker-compose.prod.yml up -d
